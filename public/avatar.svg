<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="A DJ in headphones playing two virtual decks and a mixer">
  <defs>
    <radialGradient id="glowA" cx="0" cy="1" r="0.9"><stop offset="0" stop-color="#5cc8ff" stop-opacity="0.38"/><stop offset="1" stop-color="#5cc8ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="1" cy="1" r="0.9"><stop offset="0" stop-color="#ffa040" stop-opacity="0.38"/><stop offset="1" stop-color="#ffa040" stop-opacity="0"/></radialGradient>
    <clipPath id="tile"><rect width="400" height="400" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="400" height="400" fill="#0e1013"/>
    <rect width="400" height="400" fill="url(#glowA)"/>
    <rect width="400" height="400" fill="url(#glowB)"/>
    <!-- torso, neck, head -->
    <path d="M60 400 C60 300 120 262 200 262 C280 262 340 300 340 400 Z" fill="#2c3036"/>
    <rect x="178" y="220" width="44" height="52" rx="14" fill="#33373e"/>
    <ellipse cx="200" cy="178" rx="50" ry="58" fill="#33373e"/>
    <path d="M153 162 C150 132 170 114 196 113" fill="none" stroke="#5cc8ff" stroke-width="4" stroke-linecap="round"/>
    <path d="M247 162 C250 132 230 114 204 113" fill="none" stroke="#ffa040" stroke-width="4" stroke-linecap="round"/>
    <!-- shades -->
    <rect x="166" y="167" width="68" height="17" rx="8.5" fill="#050607"/>
    <path d="M176 172 H196" stroke="#6c7178" stroke-width="2" stroke-linecap="round"/>
    <!-- headphones -->
    <path d="M146 170 C140 92 260 92 254 170" fill="none" stroke="#a3a7ad" stroke-width="9" stroke-linecap="round"/>
    <rect x="130" y="150" width="26" height="54" rx="11" fill="#1c1e22" stroke="#5cc8ff" stroke-width="3"/>
    <rect x="244" y="150" width="26" height="54" rx="11" fill="#1c1e22" stroke="#ffa040" stroke-width="3"/>
    <!-- desk -->
    <rect x="0" y="312" width="400" height="88" fill="#16181c"/>
    <path d="M0 312 H400" stroke="#33373e" stroke-width="2"/>
    
    <ellipse cx="96" cy="354" rx="72" ry="27" fill="#08090b" stroke="#5cc8ff" stroke-width="4"/>
    <ellipse cx="96" cy="354" rx="52" ry="19" fill="none" stroke="#1c1e22" stroke-width="2"/>
    <ellipse cx="96" cy="354" rx="26" ry="9.5" fill="#2c3036"/>
    
    <ellipse cx="304" cy="354" rx="72" ry="27" fill="#08090b" stroke="#ffa040" stroke-width="4"/>
    <ellipse cx="304" cy="354" rx="52" ry="19" fill="none" stroke="#1c1e22" stroke-width="2"/>
    <ellipse cx="304" cy="354" rx="26" ry="9.5" fill="#2c3036"/>
    <!-- mixer -->
    <rect x="150" y="326" width="100" height="66" rx="8" fill="#23262b" stroke="#33373e" stroke-width="2"/>
    <rect x="172" y="336" width="6" height="34" rx="3" fill="#050607"/>
    <rect x="222" y="336" width="6" height="34" rx="3" fill="#050607"/>
    <rect x="167" y="344" width="16" height="8" rx="2" fill="#a3a7ad"/>
    <rect x="217" y="352" width="16" height="8" rx="2" fill="#a3a7ad"/>
    <rect x="194" y="336" width="3" height="12" fill="#43e08c"/>
    <rect x="199" y="336" width="3" height="18" fill="#43e08c"/>
    <rect x="204" y="336" width="3" height="8" fill="#ffb020"/>
    <rect x="180" y="379" width="40" height="5" rx="2.5" fill="#050607"/>
    <rect x="191" y="373" width="16" height="12" rx="3" fill="#ece8df"/>
    <!-- arms and hands: left on the deck A platter, right on the crossfader -->
    <path d="M104 290 C70 312 72 334 94 348" fill="none" stroke="#2c3036" stroke-width="30" stroke-linecap="round"/>
    <circle cx="94" cy="350" r="15" fill="#4a4f57"/>
    <path d="M296 290 C312 336 262 372 212 380" fill="none" stroke="#2c3036" stroke-width="30" stroke-linecap="round"/>
    <circle cx="206" cy="380" r="14" fill="#4a4f57"/>
  </g>
</svg>
