<!doctype html>
<!-- Social card template (Open Graph + Twitter). Rendered by scripts/brand/build.mjs.
     Styled only with design tokens; see docs/STYLEGUIDE.md › Social images. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../node_modules/@fontsource/chakra-petch/400.css" />
<link rel="stylesheet" href="../../node_modules/@fontsource/chakra-petch/700.css" />
<link rel="stylesheet" href="../../node_modules/@fontsource/share-tech-mono/400.css" />
<link rel="stylesheet" href="../../src/design/tokens.css" />
<style>
  html, body { margin: 0; }
  body { width: var(--w); height: var(--h); overflow: hidden; background: var(--surface-page); font-family: var(--font-ui); color: var(--text); }
  .bg { position: absolute; inset: 0; background-size: cover; background-position: right center; }
  .scrim { position: absolute; inset: 0; background: linear-gradient(90deg, var(--graphite-900) 0 30%, color-mix(in srgb, var(--graphite-900) 75%, transparent) 48%, transparent 72%); }
  .content { position: absolute; left: 72px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; gap: var(--space-8); }
  .lockup { display: flex; align-items: center; gap: 20px; }
  .wordmark { font-size: var(--type-display); font-weight: var(--weight-bold); line-height: 0.95; letter-spacing: 0.01em; }
  .tagline { font-size: 30px; line-height: 1.3; color: var(--text-2); margin: 0; max-width: 520px; }
  .tagline strong { color: var(--text); font-weight: var(--weight-bold); }
  .foot { display: flex; align-items: center; gap: var(--space-7); margin-top: var(--space-4); }
  .split { display: flex; gap: var(--space-2); }
  .split i { display: block; width: 64px; height: 6px; border-radius: var(--radius-led); }
  .split i:first-child { background: var(--deck-a); box-shadow: 0 0 14px var(--deck-a); }
  .split i:last-child { background: var(--deck-b); box-shadow: 0 0 14px var(--deck-b); }
  .url { font-family: var(--font-lcd); font-size: 24px; color: var(--text-2); }
  #avatar { position: absolute; right: 64px; top: 50%; width: calc(var(--h) * 0.62); height: calc(var(--h) * 0.62); transform: translateY(-50%); filter: drop-shadow(0 8px 30px var(--shade-65)); }
  #avatar svg { display: block; }
</style>
</head>
<body>
  <div class="bg" id="bg"></div>
  <div class="scrim"></div>
  <div id="avatar"></div>
  <div class="content">
    <div class="lockup">
      <svg width="96" height="96" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="20" cy="32" r="13" fill="none" stroke="var(--deck-a)" stroke-width="5" />
        <circle cx="44" cy="32" r="13" fill="none" stroke="var(--deck-b)" stroke-width="5" />
        <rect x="25" y="28" width="14" height="8" rx="2" fill="var(--text)" />
      </svg>
      <div class="wordmark">Crossfader<br />Hero</div>
    </div>
    <p class="tagline">Mix your own music on virtual decks or vinyl. <strong>Start in your bedroom. Finish on the main stage.</strong></p>
    <div class="foot">
      <div class="split"><i></i><i></i></div>
      <span class="url">crossfaderhero.com</span>
    </div>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    document.body.style.setProperty('--w', (q.get('w') || 1200) + 'px');
    document.body.style.setProperty('--h', (q.get('h') || 630) + 'px');
    if (q.get('bg')) document.getElementById('bg').style.backgroundImage = `url(${q.get('bg')})`;
  </script>
</body>
</html>
